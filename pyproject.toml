[project]
name = "ideal-functions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KaiKnoechel", email = "s3853090@rz.uni-frankfurt.de" }
]
requires-python = ">=3.12"
dependencies = [
    "bokeh>=3.9.2",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
ideal-functions = "find_ideal_func:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "find_ideal_func"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
